{% extends 'base.html' %}
{% block title %}Login - RoadCare AI{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="form-card">
        <div class="text-center mb-4">
          <div class="bg-primary bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width:64px;height:64px">
            <i class="fas fa-sign-in-alt text-primary fa-xl"></i>
          </div>
          <h3 class="fw-bold">Citizen Login</h3>
          <p class="text-muted">Track and manage your complaints</p>
        </div>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-user text-muted"></i></span>
              <input type="text" class="form-control" name="username" required placeholder="Enter username">
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
              <input type="password" class="form-control" name="password" required placeholder="Enter password">
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="fas fa-sign-in-alt me-2"></i>Login
          </button>
        </form>
        <div class="text-center mt-4">
          <p class="text-muted mb-1">Don't have an account? <a href="{{ url_for('register') }}" class="text-primary fw-semibold">Register</a></p>
          <a href="{{ url_for('admin_login') }}" class="text-muted small"><i class="fas fa-shield-alt me-1"></i>Admin Login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
